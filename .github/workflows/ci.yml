# From https://github.com/sebastianbergmann/phpunit/blob/20ab19d3aed56fccf9569cd33c6cd0baab0ec272/.github/workflows/ci.yml
# (With many modifications)

on:
  pull_request:
  push:

name: CI

jobs:
  coding-guidelines:
    name: Coding Guidelines

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Install dependencies
        run: composer install --no-ansi --no-interaction --no-progress

      - name: Run phpcs
        run: "echo skipped-for-baseline-isolation"

      - name: Run linter
        run: composer lint

  backward-compatibility:
    name: Backward Compatibility

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: "echo skipped-for-baseline-isolation"

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none
          extensions: intl

      - name: Install roave/backward-compatibility-check
        run: "echo skipped-for-baseline-isolation"
      - name: Run roave/backward-compatibility-check
        run: "echo skipped-for-baseline-isolation"

  tests:
    name: Tests

    runs-on: ${{ matrix.os }}

    env:
      PHP_EXTENSIONS: dom, json, libxml, mbstring, pdo_sqlite, soap, xml, xmlwriter

    strategy:
      matrix:
        os:
          - ubuntu-latest

        php-version:
          - "8.2"

        php-ini-values:
          - assert.exception=1, zend.assertions=1, phar.readonly=false

        dependencies:
          - locked

        include:
          - os: ubuntu-latest
            php-version: "8.3"
            dependencies: highest
            php-ini-values: assert.exception=1, zend.assertions=1, opcache.enable=1, opcache.enable_cli=1, opcache.optimization_level=-1, opcache.jit_buffer_size=4096M, opcache.jit=1205, phar.readonly=false

          - os: ubuntu-latest
            php-version: "8.4"
            dependencies: highest
            php-ini-values: assert.exception=1, zend.assertions=1, opcache.enable=1, opcache.enable_cli=1, opcache.optimization_level=-1, opcache.jit_buffer_size=4096M, opcache.jit=1205, phar.readonly=false

          - os: ubuntu-latest
            php-version: "8.5"
            dependencies: highest
            php-ini-values: assert.exception=1, zend.assertions=1, opcache.enable=1, opcache.enable_cli=1, opcache.optimization_level=-1, opcache.jit_buffer_size=4096M, opcache.jit=1205, phar.readonly=false

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: ${{ matrix.php-ini-values }}
        # https://github.com/composer/composer/issues/9084#issuecomment-752134788https://github.com/composer/composer/issues/9084#issuecomment-752134788
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine composer cache directory on Linux
        if: matrix.os == 'ubuntu-latest'
        run: "echo skipped-for-baseline-isolation"

      - name: Determine composer cache directory on Windows
        if: matrix.os == 'windows-latest'
        run: "echo skipped-for-baseline-isolation"

      - name: Cache dependencies installed with composer
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: php${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            php${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-

      - name: Make sure composer.json is valid before we start modifyig it
        run: "echo skipped-for-baseline-isolation"

      - name: Clear platform php configuration in case we need to update phpunit
        run: "echo skipped-for-baseline-isolation"

      - name: Update phpunit if dependencies are locked in case phpunit version in lock file is not compatible
        if: matrix.dependencies == 'locked'
        run: |
          composer install --no-ansi --no-interaction --no-progress
#          composer update --no-ansi --no-interaction --no-progress phpunit/phpunit --with-all-dependencies

      - name: Install lowest dependencies with composer
        if: matrix.dependencies == 'lowest'
        run: "echo skipped-for-baseline-isolation"

      - name: Install highest dependencies with composer
        if: matrix.dependencies == 'highest'
        run: "echo skipped-for-baseline-isolation"

      - name: Show composer dependencies
        run: "echo skipped-for-baseline-isolation"

      - name: Run tests with phpunit
        run: "echo skipped-for-baseline-isolation"

      - name: Publish code coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.php-version == '8.0'
        run: "echo skipped-for-baseline-isolation"
